<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Box model</title>

        <style>
            .box {
                background-color: rgb(0, 17, 255);
            }

            .box2 {
                background-color: rgb(0, 17, 255);
                display: inline;
            }

            .box3 {
                background-color: rgb(0, 17, 255);
                display: inline-block;
                width: 100px;
                height: 100px;
            }

            .box4 {
                background-color: rgb(0, 255, 72);
                display: none;
                width: 100px;
                height: 100px;
            }

            .box5 {
                background-color: rgb(221, 255, 0);
                width: 100px;
                height: 100px;
                border: 1px dotted black;
                display: inline-block;
            }

            .box6 {
                background-color: rgb(104, 58, 109);
                width: 100px;
                height: 100px;
                border: 1px dotted black;
                display: inline-block;
                padding: 10px;

                text-align: center;
                align-content: center;
            }

             .box7 {
                background-color: rgb(65, 58, 109);
                width: 100px;
                height: 100px;
                border: 1px dotted black;
                display: inline-block;
                padding: 10px;
                margin: 10px;
                text-align: center;
                align-content: center;
            }

            .box8 {
                background-color: rgb(58, 109, 79);
                width: 100px;
                height: 100px;
                border: 1px dotted black;
                display: inline-block;
                padding: 10px;
                margin: 10px 20px 50px 30px;
                text-align: center;
                align-content: center;
            }
        </style>
    </head>


    <body>

        <div class="box">abcd</div>
        <br><br>
        <div class="box2">abcd</div>
        <div class="box2">abcd</div>
        <br><br>
        <div class="box3">abcd</div>
        <br><br>
        <div class="box4">abcd</div>

        <br><br>
        <div class="box5">abcd</div>
        <div class="box5">abcd</div>

        <br><br>
        <div class="box6">abcd</div>
        <br><br>

        <div class="box7">abcd</div>
        <div class="box7">abcd</div>
        <br>
        <div class="box7">abcd</div>
        <div class="box7">abcd</div>
        <br>
        <div class="box8">abcd</div>


        
    </body>
</html>
